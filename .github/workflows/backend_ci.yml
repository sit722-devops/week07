cd S:\SIT722\week07

Set-Content -Path .github\workflows\backend_ci.yml -Value @"
name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend_ci.yml"
  workflow_dispatch:

jobs:
  test_and_lint_backends:
    name: Test & Lint (Python) - Backends
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - product_service
          - order_service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests (if any)
        run: |
          if [ -d tests ]; then pytest -q || true; fi

  build_and_push_images:
    name: Build & Push Images to ACR
    runs-on: ubuntu-latest
    needs: test_and_lint_backends
    env:
      REGISTRY: ${{ secrets.REGISTRY_LOGIN_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR (admin user)
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push product_service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/product_service
          file: ./backend/product_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/product_service:latest
            ${{ env.REGISTRY }}/product_service:${{ github.sha }}

      - name: Build & Push order_service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/order_service
          file: ./backend/order_service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/order_service:latest
            ${{ env.REGISTRY }}/order_service:${{ github.sha }}
"@

git add .github\workflows\backend_ci.yml
git commit -m "fix(ci): remove azure login; use ACR admin creds; build+push both backends"
git push
